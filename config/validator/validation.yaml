App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: [create, edit]
                  message: "Enter city name."
        country:
            - NotBlank:
                  groups: [create]
                  message: "Select country."
        latitude:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: -90
                  max: 90
                  groups: [create, edit]
                  notInRangeMessage: "This value should be between {{ min }} and {{ max }}."
        longitude:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]
                  notInRangeMessage: "This value should be between {{ min }} and {{ max }}."

App\Entity\Measurement:
    properties:
        location:
            - NotBlank:
                  groups: [create]
                  message: "Measurement need to be assigned to location."
        date:
            - NotBlank:
                  groups: [create, edit]
                  message: "Select date."
        celsius:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: -60
                  max: 60
                  groups: [create, edit]
                  notInRangeMessage: "This value should be between {{ min }} and {{ max }}."
